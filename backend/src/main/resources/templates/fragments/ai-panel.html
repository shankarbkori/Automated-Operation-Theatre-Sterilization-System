<div th:fragment="aiPanel">
    <div class="container mt-4">
        <div class="card shadow" id="aiPanelCard" style="border-left: 4px solid var(--accent-blue);">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-robot text-primary me-2"></i>AI Anomaly Detection Insight</span>
                <span class="badge bg-primary text-uppercase" style="font-size: 0.75rem;">Active Monitoring</span>
            </div>
            <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-shield-check text-success fs-2 me-3" id="aiStatusIcon"></i>
                    <div>
                        <h5 class="text-success mb-1" id="aiStatusTitle">System Normal</h5>
                        <p class="text-muted mb-0 small" id="aiRecommendation">No anomalies detected in the current
                            sterilization parameters. Operating efficiently.</p>
                    </div>
                </div>
                <div class="progress" style="height: 6px; background-color: var(--bg-secondary);">
                    <div class="progress-bar bg-success" id="aiProgressBar" role="progressbar" style="width: 100%"
                        aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>
    </div>
</div>
