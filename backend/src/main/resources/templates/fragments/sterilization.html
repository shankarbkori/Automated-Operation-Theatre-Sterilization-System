<div th:fragment="sterilizationSection">
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-magic me-2"></i>Sterilization Control</span>
                <span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle me-1"></i>Ensure OT is
                    clear</span>
            </div>
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h5>Current Cycle Status: <span class="text-danger fw-bold" id="cycleStatus">INACTIVE</span>
                        </h5>
                        <p class="text-muted small mb-0">Use the automated relay system to initiate UV-C or Gas
                            sterilization. Cycle time limits apply.</p>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-outline-danger fw-bold px-4" id="btnSterilize">
                            <i class="bi bi-power me-1"></i> INITIATE CYCLE
                        </button>
                        <button class="btn btn-secondary fw-bold px-4 ms-2 d-none" id="btnStopSterilize">
                            <i class="bi bi-stop-circle me-1"></i> ABORT
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
