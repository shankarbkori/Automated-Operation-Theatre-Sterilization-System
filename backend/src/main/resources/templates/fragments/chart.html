<div th:fragment="chartSection">
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header"><i class="bi bi-graph-up me-2"></i>Temperature & Humidity Trend</div>
                    <div class="card-body" style="height: 300px; position: relative;">
                        <!-- Placeholder Canvas for Chart.js -->
                        <canvas id="tempHumChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header"><i class="bi bi-wind me-2"></i>Air Quality Index</div>
                    <div class="card-body" style="height: 300px; position: relative;">
                        <canvas id="airQualityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/chart.js}"></script>
</div>
