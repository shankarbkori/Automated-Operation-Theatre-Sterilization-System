<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="navbar" class="top-navbar w-100">
    <div class="d-flex align-items-center">
        <h5 class="m-0 fw-bold d-none d-md-block ms-1">OT Sterilization System</h5>
        <h5 class="m-0 fw-bold d-block d-md-none ms-1">AOTS</h5>
    </div>

    <div class="d-flex align-items-center gap-4">


        <!-- Profile Dropdown -->
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark"
                id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="d-flex align-items-center justify-content-center border rounded-circle bg-light"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-person-fill fs-4 text-secondary"></i>
                </div>
                <div class="ms-2 me-1 text-start d-none d-sm-block">
                    <div id="nav-user-fullname" style="font-size: 0.85rem; font-weight: 600; line-height: 1;">User</div>
                    <div id="nav-user-role" style="font-size: 0.75rem; color: var(--text-muted);">Role</div>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="dropdownUser">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-badge me-2"></i>Profile</a>
                </li>
                <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2"></i>Settings</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="handleLogout()"><i
                            class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
            </ul>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const roleMappings = {
                'SUPER_ADMIN': 'Super Administrator',
                'ADMIN': 'System Admin',
                'DOCTOR': 'Doctor',
                'TECHNICIAN': 'Technician'
            };
            const roleData = localStorage.getItem('role');
            const fullnameData = localStorage.getItem('fullname');

            if (roleData) {
                document.getElementById('nav-user-role').textContent = roleMappings[roleData] || roleData;
            }
            if (fullnameData) {
                document.getElementById('nav-user-fullname').textContent = fullnameData;
            }
        });

        function handleLogout() {
            document.cookie = 'jwt=; Max-Age=0; path=/;';
            localStorage.removeItem('role');
            localStorage.removeItem('token');
            localStorage.removeItem('fullname');
            localStorage.removeItem('username');
            window.location.href = '/login';
        }
    </script>
</div>

</html>
