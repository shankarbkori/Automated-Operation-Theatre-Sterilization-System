<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('History & Logs')}"></head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Navbar -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <div class="page-header">
                <div>
                    <h2 class="page-title">History & Logs</h2>
                    <p class="text-muted mb-0" style="font-size: 0.9rem;">View all sterilization cycles and system logs
                    </p>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="custom-card h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3 flex-wrap">
                            <div class="d-flex align-items-center">
                                <label class="me-2 text-muted fw-semibold" style="font-size:0.85rem;">From Date</label>
                                <input type="date" class="form-control" id="filterFromDate"
                                    style="background-color: #f8fafc; border-color: #e2e8f0; width: 140px;">
                            </div>
                            <div class="d-flex align-items-center">
                                <label class="me-2 text-muted fw-semibold" style="font-size:0.85rem;">To Date</label>
                                <input type="date" class="form-control" id="filterToDate"
                                    style="background-color: #f8fafc; border-color: #e2e8f0; width: 140px;">
                            </div>
                            <button class="btn btn-primary-custom" style="padding: 6px 16px;" onclick="fetchLogs()"><i
                                    class="bi bi-search me-1"></i> Search</button>
                            <button class="btn btn-outline-custom" style="padding: 6px 16px;" id="btnExportCSV"><i
                                    class="bi bi-file-earmark-spreadsheet me-1"></i> Export CSV</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover table-custom">
                            <thead>
                                <tr>
                                    <th>Sl No</th>
                                    <th>Date</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-4">Loading system logs...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination simulation -->
                    <div class="d-flex justify-content-center mt-3">
                        <nav aria-label="Page navigation">
                            <ul class="pagination pagination-sm border-0 gap-1">
                                <li class="page-item disabled"><a class="page-link border-0 text-muted" href="#"><i
                                            class="bi bi-chevron-left"></i></a></li>
                                <li class="page-item active"
                                    style="--bs-pagination-active-bg: var(--primary); --bs-pagination-active-border-color: var(--primary);">
                                    <a class="page-link border-0 rounded" href="#">1</a>
                                </li>
                                <li class="page-item"><a class="page-link border-0 text-muted" href="#">2</a></li>
                                <li class="page-item"><a class="page-link border-0 text-muted" href="#"><i
                                            class="bi bi-chevron-right"></i></a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        document.getElementById('nav-history').classList.add('active');

        // Set default dates
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);

        document.getElementById('filterToDate').value = today.toISOString().split('T')[0];
        document.getElementById('filterFromDate').value = firstDay.toISOString().split('T')[0];

        // Export history specifically, not sensor data
        document.getElementById('btnExportCSV').addEventListener('click', () => {
            window.location.href = '/api/reports/download?type=csv&range=history';
        });

        async function fetchLogs() {
            try {
                // Fetch sterilization sessions instead of plain system logs
                const response = await fetch('/api/session');
                if (!response.ok) return;
                let responseData = await response.json();
                let sessions = responseData.data ? responseData.data : responseData;

                const tbody = document.getElementById('history-table-body');
                tbody.innerHTML = '';

                // Filtering by Date
                const fromDate = new Date(document.getElementById('filterFromDate').value);
                const toDate = new Date(document.getElementById('filterToDate').value);
                // set toDate to end of day to include records from that day
                toDate.setHours(23, 59, 59, 999);

                sessions = sessions.filter(s => {
                    const d = new Date(s.createdAt);
                    return d >= fromDate && d <= toDate;
                });

                // Display newest first
                sessions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                if (sessions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted fw-bold">No data found</td></tr>';
                    return;
                }

                sessions.forEach((session, i) => {
                    const startTs = new Date(session.createdAt);
                    const dStr = startTs.toLocaleDateString();
                    const tStartStr = startTs.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    let endStr = '--';
                    let durationStr = '--';

                    if (session.updatedAt) {
                        const endTs = new Date(session.updatedAt);
                        endStr = endTs.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                        // Calculate duration in minutes
                        const diffMs = endTs - startTs;
                        const diffMins = Math.floor(diffMs / 60000);
                        if (diffMins > 0) {
                            durationStr = diffMins + ' min';
                        } else {
                            const diffSecs = Math.floor(diffMs / 1000);
                            durationStr = diffSecs + ' sec';
                        }
                    }

                    // Status pill
                    let status = session.currentState || 'UNKNOWN';
                    status = status.toUpperCase();
                    let badge = '';
                    if (status.includes("COMPLETED")) {
                        badge = `<span class="badge rounded-pill px-3 py-2 text-success" style="background-color: #dcfce7; border: 1px solid #bbf7d0;">Completed</span>`;
                    } else if (status.includes("ERROR") || status.includes("PAUSED")) {
                        badge = `<span class="badge rounded-pill px-3 py-2 text-danger" style="background-color: #fce8e8; border: 1px solid #f9caca;">Aborted / Paused</span>`;
                    } else {
                        badge = `<span class="badge rounded-pill px-3 py-2 text-primary" style="background-color: #dbeafe; border: 1px solid #bfdbfe;">In Progress</span>`;
                    }

                    const row = `<tr>
                        <td class="text-muted fw-medium">${i + 1}</td>
                        <td class="fw-medium">${dStr}</td>
                        <td class="text-muted">${tStartStr}</td>
                        <td class="text-muted">${endStr}</td>
                        <td class="text-muted fw-semibold">${durationStr}</td>
                        <td>${badge}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (e) {
                console.error("Failed to load logs");
            }
        }

        fetchLogs();
    </script>
</body>

</html>
