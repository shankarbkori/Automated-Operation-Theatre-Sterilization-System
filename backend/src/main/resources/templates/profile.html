<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile - OT Sterilization System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/cards.css}">
</head>

<body>
    <div class="app-container">
        <!-- Include Sidebar via Thymeleaf fragment -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <!-- Include Navbar via Thymeleaf fragment -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <div class="page-header">
                <h1 class="page-title">My Profile</h1>
            </div>

            <div class="content-wrapper">
                <div class="row">
                    <!-- Profile Stats & Image -->
                    <div class="col-md-4 mb-4">
                        <div class="custom-card text-center h-100">
                            <div class="d-flex align-items-center justify-content-center border rounded-circle bg-light mx-auto mb-3"
                                style="width: 100px; height: 100px;">
                                <i class="bi bi-person-fill text-secondary" style="font-size: 4rem;"></i>
                            </div>
                            <h4 class="fw-bold mb-1" id="display-fullname">Loading...</h4>
                            <p class="text-muted mb-3" id="display-role">Loading...</p>

                            <hr>

                            <div class="text-start">
                                <p class="mb-2"><strong>Status:</strong> <span class="badge bg-success"
                                        id="display-status">Active</span></p>
                                <p class="mb-2"><strong>Last Login:</strong> <span id="display-lastlogin"
                                        class="text-muted">...</span></p>
                                <p class="mb-0"><strong>Department:</strong> <span id="display-department"
                                        class="text-muted">...</span></p>
                            </div>
                        </div>
                    </div>

                    <!-- Editing Panels -->
                    <div class="col-md-8 mb-4">
                        <div class="custom-card mb-4">
                            <h4 class="card-title-sm">Profile Information</h4>
                            <div id="profile-success" class="alert alert-success d-none p-2 mb-3">Profile Updated!</div>
                            <form id="profileForm">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Full Name</label>
                                        <input type="text" class="form-control" id="fullname" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Username</label>
                                        <input type="text" class="form-control bg-light" id="username" disabled>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email Address</label>
                                        <input type="email" class="form-control" id="email">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Phone Number</label>
                                        <input type="tel" class="form-control" id="phone">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary-custom" id="updateProfileBtn">Save
                                    Changes</button>
                            </form>
                        </div>

                        <div class="custom-card">
                            <h4 class="card-title-sm">Change Password</h4>
                            <div id="password-alert" class="alert d-none p-2 mb-3"></div>
                            <form id="passwordForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <input type="password" class="form-control" id="oldPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary-custom" id="updatePasswordBtn">Update
                                    Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token') || '';
            const headers = {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            };

            // Fetch profile data securely via JWT Header manually mapping if Cookie falls back
            try {
                const res = await fetch('/api/users/me', { headers });
                if (res.ok) {
                    const data = await res.json();

                    document.getElementById('display-fullname').textContent = data.fullname || data.username;
                    document.getElementById('display-role').textContent = data.role;
                    document.getElementById('display-department').textContent = data.department || 'Not Assigned';

                    const date = data.lastLogin ? new Date(data.lastLogin).toLocaleString() : 'First time login';
                    document.getElementById('display-lastlogin').textContent = date;

                    document.getElementById('fullname').value = data.fullname || '';
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('phone').value = data.phone || '';
                } else {
                    // Force re-auth if JWT fails
                    window.location.href = '/login';
                }
            } catch (err) {
                console.error("Auth Fetch Error:", err);
            }

            // Update Profile Form
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                document.getElementById('updateProfileBtn').disabled = true;
                const payload = {
                    fullname: document.getElementById('fullname').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value
                };

                try {
                    const res = await fetch('/api/users/me/update', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        document.getElementById('profile-success').classList.remove('d-none');
                        setTimeout(() => document.getElementById('profile-success').classList.add('d-none'), 3000);
                        document.getElementById('display-fullname').textContent = payload.fullname;
                    }
                } finally {
                    document.getElementById('updateProfileBtn').disabled = false;
                }
            });

            // Update Password Form
            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('updatePasswordBtn');
                const alertNode = document.getElementById('password-alert');
                btn.disabled = true;

                try {
                    const res = await fetch('/api/users/me/password', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            oldPassword: document.getElementById('oldPassword').value,
                            newPassword: document.getElementById('newPassword').value
                        })
                    });

                    const data = await res.json();
                    alertNode.classList.remove('d-none', 'alert-success', 'alert-danger');

                    if (res.ok && data.success) {
                        alertNode.classList.add('alert-success');
                        alertNode.textContent = "Password changed securely.";
                        document.getElementById('passwordForm').reset();
                    } else {
                        alertNode.classList.add('alert-danger');
                        alertNode.textContent = data.message || "Failed to update password.";
                    }
                } catch (err) {
                    alertNode.classList.remove('d-none');
                    alertNode.classList.add('alert-danger');
                    alertNode.textContent = "Server communication error.";
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
